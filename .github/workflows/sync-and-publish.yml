name: Sync TYPO3 TypeScript Sources and Publish

on:
  schedule:
    # Check daily at 2 AM for new tags and new commits on TYPO3 main
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to sync'
        type: choice
        options:
          - all
          - main
          - v14.x
          - v13.x
        default: all
      tag:
        description: 'Specific TYPO3 tag for a tagged branch (e.g. v14.3.8); ignored for main'
        required: false
        type: string

permissions:
  contents: read

env:
  PACKAGE_NAME: typo3-typescript-sources
  UPSTREAM_REPO: https://github.com/TYPO3/typo3.git

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build branch matrix
        id: set-matrix
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          # mode "head": follow an upstream branch, no git tag, no npm release
          # mode "tag":  follow the newest upstream vMAJOR.x.y tag, tag + publish
          BRANCHES='[
            {"target_branch":"main","mode":"head","source_ref":"main","major":"","npm_tag":""},
            {"target_branch":"v14.x","mode":"tag","source_ref":"","major":"14","npm_tag":"latest"},
            {"target_branch":"v13.x","mode":"tag","source_ref":"","major":"13","npm_tag":"v13-latest"}
          ]'
          MATRIX=$(jq -c --arg t "$TARGET" '{include: [.[] | select($t == "all" or .target_branch == $t)]}' <<< "$BRANCHES")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sync:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sync-${{ matrix.target_branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      TARGET_BRANCH: ${{ matrix.target_branch }}
      MODE: ${{ matrix.mode }}
      MAJOR: ${{ matrix.major }}
      NPM_TAG: ${{ matrix.npm_tag }}
    steps:
      - name: Checkout split repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target_branch }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "TYPO3 TypeScript Sync Bot"
          git config --global user.email "bot@maikschneider.de"

      - name: Check upstream for changes
        id: check
        env:
          SOURCE_BRANCH: ${{ matrix.source_ref }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$MODE" = "head" ]; then
            UPSTREAM_SHA=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
            if [ -z "$UPSTREAM_SHA" ]; then
              echo "Error: upstream branch ${SOURCE_BRANCH} not found"
              exit 1
            fi

            LAST_SYNCED=$(cat .last-synced-commit 2>/dev/null || true)
            if [ "$UPSTREAM_SHA" = "$LAST_SYNCED" ]; then
              echo "No new commits on ${SOURCE_BRANCH} (current: $LAST_SYNCED)"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "New commit on ${SOURCE_BRANCH}: $UPSTREAM_SHA (previous: ${LAST_SYNCED:-none})"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "source_ref=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ -n "$MANUAL_TAG" ]; then
            if ! echo "$MANUAL_TAG" | grep -qE "^v${MAJOR}\.[0-9]+\.[0-9]+$"; then
              echo "Tag $MANUAL_TAG does not belong to ${TARGET_BRANCH} (v${MAJOR}.x), skipping sync"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            NEW_TAG="$MANUAL_TAG"
            echo "Manually specified tag: $NEW_TAG"
          else
            NEW_TAG=$(git ls-remote --tags "$UPSTREAM_REPO" | \
              grep -E "refs/tags/v${MAJOR}\.[0-9]+\.[0-9]+$" | \
              sed 's/.*refs\/tags\///' | \
              sort -V | tail -n1)
          fi

          if [ -z "$NEW_TAG" ]; then
            echo "No TYPO3 v${MAJOR}.x tag found"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SYNCED=$(cat .last-synced-tag 2>/dev/null || true)
          if [ "$NEW_TAG" = "$LAST_SYNCED" ]; then
            echo "No new version available (current: $LAST_SYNCED)"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version found: $NEW_TAG (previous: ${LAST_SYNCED:-none})"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "source_ref=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone TYPO3 repository
        if: steps.check.outputs.has_changes == 'true'
        env:
          SOURCE_REF: ${{ steps.check.outputs.source_ref }}
        run: |
          git clone --depth 1 --branch "$SOURCE_REF" "$UPSTREAM_REPO" "$RUNNER_TEMP/typo3-source"
          if [ ! -d "$RUNNER_TEMP/typo3-source/Build/Sources/TypeScript" ]; then
            echo "✗ Error: Build/Sources/TypeScript not found"
            exit 1
          fi

      - name: Sync content to split repository
        if: steps.check.outputs.has_changes == 'true'
        id: sync
        env:
          SOURCE_REF: ${{ steps.check.outputs.source_ref }}
        run: |
          SRC="$RUNNER_TEMP/typo3-source"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          cp -r "$SRC/Build/Sources/TypeScript/." .
          [ -f "$SRC/LICENSE.txt" ] && cp "$SRC/LICENSE.txt" .
          [ -f "$SRC/README.md" ] && cp "$SRC/README.md" README-TYPO3.md

          if [ "$MODE" = "head" ]; then
            SOURCE_SHA=$(git -C "$SRC" rev-parse HEAD)
            VERSION=$(sed -n "s/.*const VERSION = '\(.*\)';/\1/p" "$SRC/typo3/sysext/core/Classes/Information/Typo3Version.php")
            if [ -z "$VERSION" ]; then
              echo "Error: could not read version from Typo3Version.php"
              exit 1
            fi
            echo "$SOURCE_SHA" > .last-synced-commit
            echo "version_label=${SOURCE_REF}@${SOURCE_SHA:0:12} (${VERSION})" >> "$GITHUB_OUTPUT"
            echo "source_tree=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${SOURCE_REF#v}"
            echo "$SOURCE_REF" > .last-synced-tag
            echo "version_label=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
            echo "source_tree=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create package.json
        if: steps.check.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          SOURCE_TREE: ${{ steps.sync.outputs.source_tree }}
        run: |
          # main is installed from git only; "private" guards against an accidental npm publish
          jq -n \
            --arg name "$PACKAGE_NAME" \
            --arg version "$VERSION" \
            --arg source "$SOURCE_TREE" \
            --argjson private "$([ "$MODE" = "head" ] && echo true || echo false)" \
            '{
              name: $name,
              version: $version,
              description: "TYPO3 Core TypeScript Sources - Extracted from TYPO3/typo3 repository",
              main: "index.js",
              types: "index.d.ts",
              scripts: { test: "echo \"No tests specified\"" },
              repository: { type: "git", url: "git+https://github.com/maikschneider/typo3-typescript-sources.git" },
              keywords: ["typo3", "typescript", "sources", "cms"],
              author: "TYPO3 Core Team",
              license: "GPL-2.0-or-later",
              bugs: { url: "https://github.com/maikschneider/typo3-typescript-sources/issues" },
              homepage: "https://github.com/maikschneider/typo3-typescript-sources#readme",
              publishConfig: { access: "public" },
              typo3: {
                sourceRepository: "https://github.com/TYPO3/typo3",
                sourceTag: $source,
                sourcePath: "Build/Sources/TypeScript"
              }
            } + (if $private then { private: true } else {} end)' > package.json

          echo "✓ package.json created with version $VERSION"

      - name: Create README
        if: steps.check.outputs.has_changes == 'true'
        env:
          VERSION_LABEL: ${{ steps.sync.outputs.version_label }}
        run: |
          cat > README.md << 'EOF'
          # TYPO3 TypeScript Sources

          [![Sync and Publish](https://github.com/maikschneider/typo3-typescript-sources/actions/workflows/sync-and-publish.yml/badge.svg)](https://github.com/maikschneider/typo3-typescript-sources/actions/workflows/sync-and-publish.yml)
          [![npm version](https://badge.fury.io/js/typo3-typescript-sources.svg)](https://www.npmjs.com/package/typo3-typescript-sources)
          [![License: GPL v2](https://img.shields.io/badge/License-GPL%20v2-blue.svg)](https://www.gnu.org/licenses/old-licenses/gpl-2.0.en.html)

          This repository contains the TypeScript sources from the TYPO3 Core, automatically extracted and published to npm.

          ## 📦 Installation

          ```bash
          # Current LTS (v14)
          npm install typo3-typescript-sources

          # v13
          npm install typo3-typescript-sources@v13-latest

          # TYPO3 main (development, not published to npm)
          npm install github:maikschneider/typo3-typescript-sources#main
          ```

          ## 🔍 Source

          - **Original Repository:** [TYPO3/typo3](https://github.com/TYPO3/typo3)
          - **Source Path:** `Build/Sources/TypeScript/`
          - **Current TYPO3 Version:** `TYPO3_VERSION_PLACEHOLDER`

          ## 🌿 Branches

          | Branch   | TYPO3 Source         | npm tag      |
          |----------|----------------------|--------------|
          | `main`   | `main` (every commit) | –            |
          | `v14.x`  | v14.x releases       | `latest`     |
          | `v13.x`  | v13.x releases       | `v13-latest` |

          ## 📝 License

          This package maintains the same license as TYPO3 Core: **GPL-2.0-or-later**

          ## 🤖 Automation

          This repository is automatically synchronized with TYPO3 Core releases via GitHub Actions.

          ## ⚠️ Note

          This is an unofficial split package maintained by [@maikschneider](https://github.com/maikschneider).
          For official TYPO3 packages, please refer to the [TYPO3 Core repository](https://github.com/TYPO3/typo3).
          EOF

          sed -i "s|TYPO3_VERSION_PLACEHOLDER|${VERSION_LABEL}|" README.md

      - name: Commit changes
        if: steps.check.outputs.has_changes == 'true'
        id: commit
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          VERSION_LABEL: ${{ steps.sync.outputs.version_label }}
          SOURCE_TREE: ${{ steps.sync.outputs.source_tree }}
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Sync with TYPO3 ${VERSION_LABEL}" \
            -m "Source: https://github.com/TYPO3/typo3/tree/${SOURCE_TREE}
          Path: Build/Sources/TypeScript/"

          if [ "$MODE" = "tag" ]; then
            git tag -a "${VERSION}" -m "Release ${VERSION} from TYPO3 ${VERSION_LABEL}"
          fi

          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: matrix.mode == 'tag'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Publish unpublished versions to npm
        if: matrix.mode == 'tag'
        id: publish
        run: |
          # Trusted publishing (OIDC) needs npm >= 11.5.1
          npm install -g npm@^11.5.1

          PUBLISHED=$(npm view "$PACKAGE_NAME" versions --json 2>/dev/null || echo '[]')

          # Ascending order, so the dist-tag ends on the newest version
          PUBLISHED_NOW=""
          for VERSION in $(git tag -l | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" | sort -V); do
            if jq -e --arg v "$VERSION" '[.] | flatten | index($v) != null' <<< "$PUBLISHED" > /dev/null; then
              continue
            fi

            echo "Publishing ${VERSION} with dist-tag ${NPM_TAG}"
            DIR="$RUNNER_TEMP/publish-${VERSION}"
            git worktree add --detach "$DIR" "$VERSION"
            (cd "$DIR" && npm publish --access public --tag "$NPM_TAG")
            git worktree remove --force "$DIR"
            PUBLISHED_NOW="${PUBLISHED_NOW} ${VERSION}"
          done

          echo "versions=${PUBLISHED_NOW# }" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.committed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          git push origin "HEAD:${TARGET_BRANCH}"
          if [ "$MODE" = "tag" ]; then
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Create GitHub releases
        if: matrix.mode == 'tag' && steps.publish.outputs.versions != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSIONS: ${{ steps.publish.outputs.versions }}
        run: |
          NEWEST=$(tr ' ' '\n' <<< "$VERSIONS" | sort -V | tail -n1)
          for VERSION in $VERSIONS; do
            if gh release view "$VERSION" > /dev/null 2>&1; then
              continue
            fi

            LATEST=false
            if [ "$NPM_TAG" = "latest" ] && [ "$VERSION" = "$NEWEST" ]; then
              LATEST=true
            fi

            gh release create "$VERSION" \
              --verify-tag \
              --title "TYPO3 ${VERSION}" \
              --latest="$LATEST" \
              --notes "Synchronized with TYPO3 Core v${VERSION}

          **Source:** https://github.com/TYPO3/typo3/tree/v${VERSION}
          **Path:** \`Build/Sources/TypeScript/\`"
          done
